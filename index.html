<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Hub for Technical Leaders</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f7fb;
    --panel: #ffffff;
    --ink: #121826;
    --ink2: #475166;
    --ink3: #7a8499;
    --line: #e2e7f0;
    --brand: #3556d8;
    --brand2: #7c3aed;
    --good: #128a4a;
    --good-soft: #e6f7ee;
    --warn: #b45309;
    --warn-soft: #fff3df;
    --bad: #c0264d;
    --bad-soft: #fdecf1;
    --radius: 16px;
    --shadow-sm: 0 1px 2px rgba(16,24,40,.06);
    --shadow: 0 6px 22px rgba(16,24,40,.08);
    --shadow-lg: 0 14px 40px rgba(16,24,40,.14);
    --cc: #3556d8;
    --cc2: #7c3aed;
    --topbar-h: 60px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .ico { flex-shrink: 0; vertical-align: middle; }
  h1,h2,h3,h4 { margin: 0; }

  /* ---------- Top bar ---------- */
  #topbar {
    position: sticky; top: 0; z-index: 60; height: var(--topbar-h);
    background: rgba(255,255,255,.96); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; padding: 0 20px;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
  .logo-mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
  .top-links a { font-size: 14px; font-weight: 600; color: var(--ink2); padding: 8px 10px; border-radius: 8px; }
  .top-links a:hover { background: var(--bg); color: var(--ink); }
  .spacer { flex: 1; }
  .top-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--ink2); background: var(--bg); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
  .menu-btn { display: none; background: none; border: none; padding: 6px; border-radius: 8px; cursor: pointer; color: var(--ink); }
  body.has-side .menu-btn { display: none; }

  /* ---------- Layout ---------- */
  #layout { display: flex; align-items: flex-start; }
  #sidebar {
    display: none; width: 304px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--line);
    position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); overflow-y: auto; padding: 18px 14px 28px;
  }
  body.has-side #sidebar { display: block; }
  #main { flex: 1; min-width: 0; padding: 28px 40px 90px; max-width: 1060px; margin: 0 auto; }
  #main.wide { max-width: 1180px; }

  /* ---------- Sidebar ---------- */
  .side-back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--ink2); padding: 6px 8px; border-radius: 8px; margin-bottom: 10px; }
  .side-back:hover { background: var(--bg); color: var(--ink); }
  .side-course { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 14px; background: #fff; }
  .side-art { height: 84px; }
  .side-body { padding: 12px 14px 14px; }
  .side-title { font-weight: 800; font-size: 14px; line-height: 1.3; margin-bottom: 8px; }
  .progress-mini-label { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink3); margin-bottom: 5px; font-weight: 600; }
  .progress-track { height: 7px; border-radius: 6px; background: var(--line); overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--cc), var(--cc2)); border-radius: 6px; transition: width .4s ease; }
  .side-label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink3); margin: 16px 10px 6px; font-weight: 800; }
  .side-item { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 10px; font-size: 13.5px; font-weight: 600; color: var(--ink2); border: 1px solid transparent; }
  .side-item:hover { background: var(--bg); color: var(--ink); }
  .side-item.active { background: color-mix(in srgb, var(--cc) 10%, white); border-color: color-mix(in srgb, var(--cc) 25%, white); color: var(--cc); }
  .side-item .lbl { flex: 1; line-height: 1.3; }
  .s-mark { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #cdd4e1; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; color: #fff; }
  .s-mark.done { background: var(--good); border-color: var(--good); }
  .s-mark.prog { border-color: var(--warn); background: linear-gradient(90deg, var(--warn) 50%, transparent 50%); }
  .s-ico { width: 20px; display: inline-flex; justify-content: center; color: var(--ink3); }

  /* ---------- Buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--cc); color: #fff; border: 1px solid transparent; padding: 11px 20px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn:hover { filter: brightness(.92); }
  .btn.light { background: #fff; color: #1e2a78; }
  .btn.ghost { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.45); }
  .btn.ghost:hover { background: rgba(255,255,255,.24); }
  .btn.outline { background: #fff; color: var(--cc); border-color: color-mix(in srgb, var(--cc) 35%, white); }
  .btn.outline:hover { background: color-mix(in srgb, var(--cc) 8%, white); }
  .btn.sm { padding: 8px 14px; font-size: 13px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* ---------- Home ---------- */
  .hero { position: relative; overflow: hidden; border-radius: 22px; background: linear-gradient(120deg, #1b2670 0%, #3556d8 55%, #7c3aed 100%); color: #fff; padding: 46px 44px; margin-bottom: 26px; min-height: 280px; display: flex; align-items: center; box-shadow: var(--shadow-lg); }
  .hero-art { position: absolute; right: 0; top: 0; height: 100%; width: 58%; }
  .hero-art svg { width: 100%; height: 100%; display: block; }
  .hero-copy { position: relative; z-index: 2; max-width: 540px; }
  .hero-tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); padding: 5px 12px; border-radius: 999px; }
  .hero h1 { font-size: 40px; line-height: 1.1; margin: 14px 0 12px; letter-spacing: -.025em; }
  .hero p { font-size: 16px; line-height: 1.55; opacity: .93; margin: 0 0 22px; }
  .hero-cta { display: flex; gap: 10px; flex-wrap: wrap; }

  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 26px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow-sm); }
  .stat .stat-ico { width: 42px; height: 42px; border-radius: 12px; background: color-mix(in srgb, var(--brand) 10%, white); color: var(--brand); display: inline-flex; align-items: center; justify-content: center; }
  .stat b { font-size: 22px; display: block; line-height: 1.1; }
  .stat span { font-size: 12.5px; color: var(--ink3); font-weight: 600; }

  .section-title { font-size: 22px; font-weight: 800; letter-spacing: -.015em; margin: 6px 0 14px; scroll-margin-top: calc(var(--topbar-h) + 16px); }
  #profile { scroll-margin-top: calc(var(--topbar-h) + 16px); }
  .continue-card { display: flex; align-items: center; gap: 16px; background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--cc); border-radius: 14px; padding: 16px 18px; margin-bottom: 26px; box-shadow: var(--shadow-sm); }
  .continue-card:hover { box-shadow: var(--shadow); }
  .continue-card .cc-text { flex: 1; min-width: 0; }
  .eyebrow { font-size: 11.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--cc); }
  .continue-card .cc-title { font-weight: 800; font-size: 17px; margin: 2px 0; }
  .continue-card .cc-sub { font-size: 13px; color: var(--ink3); }
  .go { width: 38px; height: 38px; border-radius: 50%; background: var(--cc); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

  .course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
  .course-card { background: #fff; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; box-shadow: var(--shadow-sm); transition: transform .15s ease, box-shadow .15s ease; }
  .course-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
  .course-card:focus-visible { outline: 3px solid var(--cc); outline-offset: 3px; }
  .cc-art { position: relative; height: 150px; }
  .cc-badge { position: absolute; left: 14px; top: 14px; background: rgba(255,255,255,.92); color: var(--ink); font-size: 11.5px; font-weight: 800; padding: 4px 10px; border-radius: 999px; }
  .cc-body { padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .cc-meta { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink3); font-weight: 600; }
  .course-card h3 { font-size: 18px; line-height: 1.25; letter-spacing: -.01em; }
  .cc-tag { font-size: 13.5px; color: var(--ink2); margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 11.5px; font-weight: 700; color: var(--cc); background: color-mix(in srgb, var(--cc) 10%, white); padding: 4px 10px; border-radius: 999px; }
  .cc-prog { margin-top: auto; padding-top: 6px; }
  .cc-cta { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; color: var(--cc); margin-top: 8px; }

  .profile-card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; box-shadow: var(--shadow-sm); }
  .profile-card .avatar { width: 52px; height: 52px; font-size: 20px; }
  .profile-card .pc-text { flex: 1; min-width: 220px; }
  .profile-card h3 { font-size: 16px; margin-bottom: 2px; }
  .profile-card p { margin: 0; font-size: 13px; color: var(--ink3); }
  input.name-input { font-size: 15px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); width: 100%; max-width: 320px; font-family: inherit; background: var(--bg); }
  input.name-input:focus { outline: 2px solid var(--brand); background: #fff; }
  .foot-actions { display: flex; justify-content: flex-end; margin-top: 18px; }
  .link-btn { background: none; border: none; color: var(--ink3); font-size: 12.5px; cursor: pointer; text-decoration: underline; font-family: inherit; }
  .link-btn:hover { color: var(--bad); }

  /* ---------- Course page ---------- */
  .crumbs { font-size: 13px; color: var(--ink3); font-weight: 600; margin-bottom: 12px; }
  .crumbs a:hover { color: var(--cc); }
  .c-hero { position: relative; overflow: hidden; border-radius: 22px; background: linear-gradient(120deg, var(--cc), var(--cc2)); color: #fff; padding: 38px 40px; margin-bottom: 22px; box-shadow: var(--shadow-lg); }
  .c-hero .art { position: absolute; right: 0; top: 0; height: 100%; width: 46%; }
  .c-hero .art svg { width: 100%; height: 100%; display: block; }
  .c-hero .copy { position: relative; z-index: 2; max-width: 600px; }
  .c-hero h1 { font-size: 32px; line-height: 1.15; letter-spacing: -.02em; margin: 10px 0; }
  .c-hero p { font-size: 15.5px; opacity: .95; margin: 0 0 18px; line-height: 1.55; }
  .c-hero .tagline-pill { display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); padding: 4px 12px; border-radius: 999px; }
  .c-stats { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; font-size: 13.5px; font-weight: 700; }
  .c-stats span { display: inline-flex; align-items: center; gap: 7px; }
  .c-prog-line { max-width: 360px; margin-top: 16px; }
  .c-prog-line .progress-mini-label { color: rgba(255,255,255,.9); }
  .c-prog-line .progress-track { background: rgba(255,255,255,.28); }
  .c-prog-line .progress-fill { background: #fff; }
  .note-box { font-size: 13px; color: var(--ink2); background: #fff; border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 20px; }

  .two-col { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; margin-bottom: 22px; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; box-shadow: var(--shadow-sm); }
  .panel h2 { font-size: 19px; font-weight: 800; margin-bottom: 14px; letter-spacing: -.01em; }
  .learn-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .learn-list li { display: flex; gap: 10px; font-size: 14px; color: var(--ink2); line-height: 1.45; }
  .learn-list li .ico { color: var(--good); margin-top: 2px; }

  .syl-item { display: flex; align-items: center; gap: 16px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow-sm); }
  .syl-item:hover { box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--cc) 35%, white); }
  .syl-text { flex: 1; min-width: 0; }
  .syl-num { font-size: 11.5px; font-weight: 800; color: var(--cc); letter-spacing: .07em; text-transform: uppercase; }
  .syl-title { font-weight: 800; font-size: 16px; line-height: 1.3; }
  .syl-sub { font-size: 13px; color: var(--ink3); margin-top: 2px; }
  .syl-meta { font-size: 12.5px; color: var(--ink3); display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
  .thumb { display: inline-flex; align-items: center; justify-content: center; border-radius: 14px; background: linear-gradient(135deg, var(--cc), var(--cc2)); color: #fff; flex-shrink: 0; }
  .status-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 800; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .status-pill.notstarted { background: var(--bg); color: var(--ink3); border: 1px solid var(--line); }
  .status-pill.progress { background: var(--warn-soft); color: var(--warn); }
  .status-pill.done { background: var(--good-soft); color: var(--good); }
  .status-pill.locked { background: var(--bg); color: var(--ink3); border: 1px solid var(--line); }

  /* ---------- Unit page ---------- */
  .unit-head { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 14px; }
  .unit-head h1 { font-size: 29px; line-height: 1.15; letter-spacing: -.02em; margin: 4px 0 6px; }
  .unit-head p { margin: 0 0 10px; color: var(--ink2); font-size: 15px; max-width: 680px; }
  .meta-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .meta-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--ink2); background: #fff; border: 1px solid var(--line); padding: 5px 11px; border-radius: 999px; }
  .subnav { position: sticky; top: var(--topbar-h); z-index: 30; background: rgba(245,247,251,.94); backdrop-filter: blur(8px); padding: 10px 0; margin: 0 0 14px; display: flex; gap: 8px; overflow-x: auto; border-bottom: 1px solid var(--line); }
  .subnav button { font-family: inherit; font-size: 13px; font-weight: 700; color: var(--ink2); background: #fff; border: 1px solid var(--line); padding: 7px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .subnav button:hover { color: var(--cc); border-color: color-mix(in srgb, var(--cc) 40%, white); }
  .sec { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 24px 26px; margin-bottom: 20px; box-shadow: var(--shadow-sm); scroll-margin-top: 130px; }
  .sec-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .sec-head h3 { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
  .sec-ico { width: 34px; height: 34px; border-radius: 10px; background: color-mix(in srgb, var(--cc) 12%, white); color: var(--cc); display: inline-flex; align-items: center; justify-content: center; }
  .sec p { font-size: 15px; line-height: 1.65; color: #2a3142; margin: 0 0 12px; }
  .sec h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); margin: 18px 0 8px; font-weight: 800; }
  .concept { display: flex; gap: 16px; padding: 18px 0; border-top: 1px solid var(--line); }
  .concept:first-of-type { border-top: none; padding-top: 4px; }
  .concept-num { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--cc), var(--cc2)); color: #fff; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .concept h4 { font-size: 16.5px; text-transform: none; letter-spacing: -.005em; color: var(--ink); margin: 3px 0 6px; }
  .example { background: color-mix(in srgb, var(--cc) 7%, white); border-left: 4px solid var(--cc); border-radius: 10px; padding: 12px 15px; font-size: 14px; line-height: 1.6; color: #232a3b; margin-top: 8px; }
  .example .tag { display: block; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--cc); margin-bottom: 3px; }
  .sec.case { border-left: 5px solid var(--cc); }
  .task-box { background: var(--bg); border-radius: 12px; padding: 14px 16px; margin-top: 8px; }
  .task-box .tag { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--cc); }
  .task-box p { margin: 4px 0 0; }
  .sec.everyday { background: linear-gradient(180deg, color-mix(in srgb, var(--cc) 6%, white), #fff); }
  .deliverable { background: color-mix(in srgb, var(--cc) 7%, white); border: 1px solid color-mix(in srgb, var(--cc) 20%, white); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .deliverable .tag { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--cc); }
  .deliverable p { margin: 4px 0 0; }
  .num-row { display: flex; gap: 10px; padding: 8px 0; font-size: 14.5px; color: #2a3142; border-bottom: 1px dashed var(--line); }
  .num-row:last-child { border-bottom: none; }
  .num-row b { color: var(--cc); min-width: 20px; }
  .check-head { display: flex; align-items: center; gap: 12px; margin: 6px 0 8px; }
  .check-head .progress-track { flex: 1; }
  .check-count { font-size: 12.5px; font-weight: 800; color: var(--ink2); }
  .rubric-row { display: flex; align-items: flex-start; gap: 12px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; cursor: pointer; background: #fff; }
  .rubric-row:hover { background: var(--bg); }
  .rubric-row input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--cc); flex-shrink: 0; }
  .rubric-row span { font-size: 14px; line-height: 1.5; color: #2a3142; }
  .reflect-list { margin: 0; padding-left: 22px; }
  .reflect-list li { font-size: 15px; line-height: 1.6; margin-bottom: 10px; color: #2a3142; padding-left: 4px; }
  .quiz-q { padding: 16px 0; border-top: 1px solid var(--line); }
  .quiz-q:first-of-type { border-top: none; padding-top: 0; }
  .qtext { font-weight: 700; font-size: 15px; margin-bottom: 10px; line-height: 1.45; }
  .quiz-opt { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border-radius: 10px; margin-bottom: 7px; cursor: pointer; border: 1px solid var(--line); font-size: 14px; background: #fff; }
  .quiz-opt:hover { border-color: color-mix(in srgb, var(--cc) 45%, white); background: color-mix(in srgb, var(--cc) 5%, white); }
  .quiz-opt input { margin-top: 3px; accent-color: var(--cc); }
  .quiz-opt.correct { background: var(--good-soft); border-color: #a9dfc0; }
  .quiz-opt.incorrect { background: var(--bad-soft); border-color: #f2b9c8; }
  .quiz-result { margin-top: 14px; padding: 13px 16px; border-radius: 12px; font-size: 14px; font-weight: 700; }
  .quiz-result.pass { background: var(--good-soft); color: var(--good); }
  .quiz-result.fail { background: var(--bad-soft); color: var(--bad); }
  .nav-buttons { display: flex; justify-content: space-between; gap: 10px; margin-top: 26px; }
  .diagram-card pre.mermaid { background: #fff; text-align: center; margin: 0; overflow-x: auto; font-size: 13px; }
  .diagram-fallback { white-space: pre; font-size: 12px; background: var(--bg); border: 1px dashed var(--line); padding: 12px; overflow-x: auto; border-radius: 8px; margin: 0; }

  /* ---------- Certificate / bonus ---------- */
  .cert-wrap { display: flex; justify-content: center; padding: 10px 0 20px; }
  .certificate { position: relative; width: 100%; max-width: 760px; border-radius: 20px; padding: 54px 56px; text-align: center; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow-lg); overflow: hidden; }
  .certificate::before { content: ""; position: absolute; inset: 12px; border: 2px solid var(--cc); border-radius: 14px; opacity: .55; pointer-events: none; }

(function(){
  "use strict";

  var STORAGE_KEY = "learning_hub_progress_v1";
  var OLD_STORAGE_KEY = "fdi_course_progress_v1";

  function defaultState(){ return { learnerName: "", progress: {} }; }
  function defaultCourseProgress(){ return { modules: {}, completedAt: null, visited: {} }; }

  function isObj(v){ return !!v && typeof v === "object" && !Array.isArray(v); }
  // Saved JSON may be hand-edited or from an older build; coerce it to the expected shape.
  function normalizeState(s){
    var out = defaultState();
    if (!isObj(s)) return out;
    if (typeof s.learnerName === "string") out.learnerName = s.learnerName;
    if (isObj(s.progress)){
      Object.keys(s.progress).forEach(function(k){
        var cp = s.progress[k];
        if (!isObj(cp)) return;
        var mods = {};
        if (isObj(cp.modules)){
          Object.keys(cp.modules).forEach(function(id){
            var ms = cp.modules[id];
            if (!isObj(ms)) return;
            mods[id] = {
              assignment: isObj(ms.assignment) ? ms.assignment : {},
              quizAnswers: Array.isArray(ms.quizAnswers) ? ms.quizAnswers : null,
              quizScore: typeof ms.quizScore === "number" ? ms.quizScore : null,
              quizPassed: ms.quizPassed === true
            };
          });
        }
        var visited = {};
        if (isObj(cp.visited)) Object.keys(cp.visited).forEach(function(v){ if (cp.visited[v] === true) visited[v] = true; });
        out.progress[k] = { modules: mods, completedAt: typeof cp.completedAt === "string" ? cp.completedAt : null, visited: visited };
      });
    }
    return out;
  }

  function loadState(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return normalizeState(JSON.parse(raw));
      var old = localStorage.getItem(OLD_STORAGE_KEY);
      if (old){
        var oldState = JSON.parse(old);
        var migrated = defaultState();
        migrated.learnerName = oldState.learnerName || "";
        migrated.progress.fin = { modules: oldState.modules || {}, completedAt: oldState.completedAt || null };
        return normalizeState(migrated);
      }
    } catch(e){}
    return defaultState();
  }
  function saveState(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
  }
  var state = loadState();

  function getCourseProgress(courseKey){
    if (!state.progress[courseKey]) state.progress[courseKey] = defaultCourseProgress();
    return state.progress[courseKey];
  }
  function getModState(courseKey, localId){
    var cp = getCourseProgress(courseKey);
    if (!cp.modules[localId]) cp.modules[localId] = { assignment: {}, quizAnswers: null, quizScore: null, quizPassed: false };
    return cp.modules[localId];
  }

  // ============================================================
  // COURSE 1: FINANCE & DATA INTELLIGENCE

  var FIN_MODULES = [
    {
      id: "m1", num: "Module 1", title: "Financial Dashboards",

          ex: "North Star = Net Revenue Retention (108%). Driver = churn rate (6%). Input = support first-response time — accounts with >24hr response churn at 11% vs 4% for <4hr response." },
        { t: "Common Executive KPI Vocabulary",
          body: "CAC, LTV, LTV:CAC ratio (3:1+ is healthy), Gross Margin, Burn Multiple (net burn ÷ net new ARR — lower is more efficient), Rule of 40 (growth % + profit margin % should exceed 40).",
          ex: "35% YoY growth with -10% operating margin → Rule of 40 score = 35 + (-10) = 25, below the 40 threshold: growth isn't yet capital-efficient." }

      caseTitle: "SaaS — The Dashboard That Missed the Warning",
      caseText: "A mid-market SaaS company's board dashboard shows ARR growing steadily at 22% YoY for three quarters — green across the board. But NPS among accounts due for renewal has quietly dropped from 42 to 19, and usage-days per seat is down 15% among enterprise accounts. None of this is on the dashboard, which is built entirely on lagging revenue and logo-count metrics.",

      assignment: {
        deliverable: "Build a one-page executive KPI dashboard (spreadsheet, sheet, or BI tool) for a hypothetical company using 12 months of MRR, new customers, churned customers, support tickets, and average deal size. Include one North Star metric, 3–4 driver metrics with trend arrows, and one leading indicator not derived directly from revenue.",
        rubric: [

          opts: ["Lagging indicator","Leading indicator","Vanity metric","North Star metric"], correct: 1 },
        { q: "The 'One Dashboard, One Decision' rule means an ideal executive dashboard should:",
          opts: ["Include as many metrics as possible for completeness","Map to a specific decision with a small number of metrics","Only show revenue metrics","Be updated once a year"], correct: 1 },

          opts: ["Operational inputs","Driver metrics","One North Star metric","Raw data logs"], correct: 2 },
        { q: "A company grows ARR 35% YoY with -10% operating margin. What is its Rule of 40 score?",

    {

          body: "CAC Payback = CAC ÷ (monthly revenue per customer × gross margin %). It tells you how long it takes to earn back what you spent to acquire a customer.",

          ex: "Vague: 'Be the leading AI-enabled data partner.' Specific: 'By 2030 an operations manager at a mid-size logistics client can go from a data question to a trusted answer in one working day, and we are paid for answers delivered rather than hours worked.' The second version names a person, a measure and a business model, so a team can test their plans against it." },
        { t: "Backcasting: Working Backward from the Goal",
          body: "Forecasting asks where today's path leads. Backcasting starts at the preferred future and asks what must already be true one step earlier, then one step before that, until you reach something you can start this quarter. It exposes the long-lead items that a forward plan postpones, and it turns a distant aim into a chain of dated conditions that can each be checked.",
          ex: "Goal for 2030: 60% of revenue from outcome-priced work. So by 2029 it must be 40%, with the pricing model accepted by procurement teams. By 2028: 20%, proven with ten clients. By 2027: three paid pilots and a reliable way to measure outcomes. This quarter: choose one willing client and agree the outcome metric. The measurement system is the long-lead item, and it has to start now." },

          body: "People do not act on a matrix. They act on something they can picture. Turn the preferred future into an artefact that looks as if it came from that year: a press release, a job advert, a customer's diary entry, a mock dashboard or a one-page price list. A concrete artefact draws out specific objections ('we could never hire for that'), and those objections are exactly the obstacles the plan must address.",
          ex: "A job advert dated 2030: 'Delivery lead. You will run a team of four engineers and around thirty software agents, own outcome targets for three clients and review exceptions rather than pull requests.' Shown to the current team, it raises better questions in ten minutes than a strategy deck does in an hour: who trains for this, what happens to today's roles, and how exceptions are priced." },

      concepts: [
        { t: "The Layers, and Modernising One at a Time",
          body: "Think of the data stack as layers: sources where data enters, a platform that connects and serves it, a semantic layer that gives it meaning, data products that package it for reuse, and a consumption layer where applications and agents use it. Governance and access control run through all of them. A common pattern for the platform is to refine data in stages from raw to curated to business-ready. The practical advice is to modernise the layers a chosen workflow depends on, with replaceable parts, and not to rebuild everything first.",
          ex: "A full platform rebuild is quoted at $6M over 24 months, with no agent in production until the end. Modernising only the two layers the first workflow needs, a governed interface on the platform and a small semantic model, costs $900K over five months and delivers a working agent. The second workflow reuses most of it." },
        { t: "Unstructured Data and Search by Meaning",
          body: "Most of what agents need is in documents, emails and images, not tables. To use it, content is split into passages and converted into numeric representations so that it can be searched by meaning instead of by keyword. Creating these representations is cheap. Keeping them current as documents change, and keeping access rules attached to every passage, is the real work. A stale index answers confidently from documents that are no longer true.",
          ex: "Eighty thousand documents averaging 2,500 tokens is 200 million tokens. At $0.10 per million, creating the search representations costs about $20, once. But 3% of documents change every week: 2,400 documents that must be detected, reprocessed and re-indexed. The initial load is trivial. The weekly refresh process is what needs an owner." },
        { t: "The Semantic Layer: Turning Data into Meaning",
          body: "The semantic layer records what things are, how they relate and what rules apply, in a form both people and software can read. It is usually built from an agreed vocabulary of business concepts and a graph linking real records to those concepts. Without it, each agent infers meaning for itself and different agents reach different conclusions from the same data. With it, 'customer', 'order' and 'active' mean one thing everywhere.",
          ex: "Define 'active customer' once: at least one purchase in the last 12 months and the account not closed. Applied across the three systems that previously reported 48,200, 45,900 and 51,300 customers, the shared definition yields a single figure of 44,700. The number is less important than the fact that every agent now gets the same one." },
        { t: "Data Products and Governed Interfaces",
          body: "A data product is a dataset packaged for reuse: it has a named owner, a stated quality standard, documented meaning and a stable interface. Agents should reach data through these interfaces and through a controlled gateway, never by direct access to underlying tables. That is what makes it possible to enforce permissions, record what was retrieved and why, and change what sits underneath without breaking every agent.",
          ex: "A customer data product costs $150K to build and $30K a year to run, and five workflows use it: a $30K share of the build each. Building a separate pipeline for each workflow would cost about $90K apiece, $450K in total, with five versions of the truth. The product approach costs a third as much and can be governed in one place." }

      concepts: [
        { t: "Measuring Quality Against a Purpose",
          body: "Data quality has several dimensions: accuracy, completeness, timeliness, consistency, uniqueness and validity. None of them has a universal pass mark. Quality means fit for a particular use, so set a threshold per dimension for each use and measure against it. The same field can be good enough for a quarterly report and nowhere near good enough for an agent that acts on every record.",
          ex: "A delivery address field is 97% complete and 91% valid, and 12% of entries are more than two years old. For a marketing report that is acceptable. For an agent that books deliveries, the requirement is 99% valid. At 5,000 bookings a month, the gap between 91% and 99% is 400 failed deliveries a month that the report never noticed." },
        { t: "From Periodic Cleanup to Continuous Monitoring",
          body: "Cleaning data every quarter assumes that somebody looks at it before acting. Agents act immediately and continuously, so an error lives as long as the gap between checks. Quality controls belong inside the pipelines: automatic validation as data arrives, detection of unusual values, and the ability to hold back bad data before anything consumes it. The measure to watch is how long a defect survives.",
          ex: "A faulty feed loads wrong prices for 3% of products. An agent makes 2,000 pricing decisions a day using that field, so 60 a day are wrong. With quarterly cleanup the error can live for 90 days: 5,400 bad decisions. With a check in the pipeline that catches it within an hour, about three decisions are affected. The fix is the same. Only the detection time differs." },
        { t: "Quality for Documents and Other Unstructured Content",
          body: "Documents have quality problems of their own: duplicates, superseded versions, missing dates and owners, and files that contradict one another. A search system cannot tell which version is current unless something tells it. Unstructured content needs the same care as tables: classification, tags, a named owner, a review date and removal of what is out of date.",
          ex: "A knowledge base holds 12,000 documents, of which 22% are duplicates or superseded. An agent retrieves the five most relevant passages for each question. The chance that at least one comes from a stale document is 1 − 0.78 to the power of 5, about 71%. Most answers are being built partly on outdated material, and removing 2,640 documents would help more than any change to the model." },
        { t: "Agents Write Data Too",
          body: "Agents do not only read. They update records, create summaries, label content and trigger transactions, and other systems and agents then rely on what they wrote. Agent output must meet the same standards as any other data: validated before it is saved, marked with its origin, reconciled against the system of record, and written through governed interfaces. Otherwise small error rates accumulate into a polluted dataset.",
          ex: "An agent updates 1,500 customer records a day with a 2% error rate: 30 bad records a day, about 11,000 a year. Those records feed the next agent's decisions. Validation rules on write that reject two-thirds of the errors cut this to roughly 3,700 a year, and tagging every agent-written field makes the remainder possible to find and correct." }

        { t: "Four Levels: Events, Patterns, Structures, Beliefs",
          body: "Most of our attention goes to events: the outage, the missed deadline, the resignation. Beneath an event there is usually a pattern, the same kind of thing happening repeatedly. Beneath the pattern is a structure: the processes, rules, incentives and dependencies that produce it. Beneath that are the beliefs that keep the structure in place. Reacting to events is firefighting. Changing structures and beliefs is how a problem stops coming back.",
          ex: "Event: an outage on Tuesday. Pattern: seven outages in six months, five of them within 48 hours of a release. Structure: releases are batched fortnightly with no staged rollout, and the person on call is also the person releasing. Belief: 'releasing less often is safer.' A post-incident fix for Tuesday changes nothing about the next one. Changing the belief about release frequency changes all of them." },
        { t: "From Straight Lines to Loops",
          body: "We are taught to think in straight lines: A causes B. In real organisations effects circle back and become causes. A leads to B, B leads to C, and C makes A worse or better. Once you see a loop, behaviour that looked like bad luck or bad people starts to look like the natural result of how things are connected. The question shifts from 'who did this?' to 'what keeps producing this?'",

          ex: "Version one of an incident summary: 'Root causes: certificate expiry, alert misrouting, runbook gap.' Version two: 'At 2am a certificate expired. The alert went to a team that had been disbanded in March, so nobody was paged for 50 minutes. The engineer who finally responded had never seen the system and found no runbook.' Both contain the same three facts. Only the second can be repeated accurately the next day." },
        { t: "Decisions Need a Reason to Care",
          body: "People like to believe they decide on evidence. In practice they first need a reason to care, then use the evidence to check and justify the choice. Sound analysis is necessary and is rarely enough. If the audience does not feel what is at stake, for someone they can picture, a strong business case is simply filed. Showing the stakes is not manipulation. It is completing the argument.",
          ex: "A migration proposal with a 3.1 times return over three years is deferred twice. The third version opens with the on-call engineer who was paged eleven times last month, twice during a family holiday, and has started interviewing elsewhere. The numbers are unchanged and now sit in the second half. It is approved, and the approver quotes the engineer's story when explaining the decision to finance." },
        { t: "The Expert's Blind Spot",
          body: "Once you understand something well, it is very hard to remember what it was like not to. Experts skip steps, use terms the audience does not share and speak in abstractions that feel precise to them and empty to everyone else. The cure is to move deliberately between the general point and a concrete example the listener can see, and to test your explanation on someone outside the field.",
          ex: "Abstract: 'We have eventual consistency issues in the replication layer.' Concrete: 'A customer pays, refreshes the page, and for about 40 seconds their order is missing. Around 300 of them phoned us about it last month.' The first is accurate and gets a nod. The second gets a budget, because the listener can see the customer and count the calls." }

  B --> C["Show what is at stake, for someone specific"]
  C --> D["Support it with the evidence that matters"]
  D --> E["Make the next step clear"]
  E --> F["Remembered and retold"]` }

        { t: "Start from the Audience",

          ex: "A proposal to rebuild a data pipeline goes to three people. The finance director asks what it costs and when it pays back. The head of engineering asks what it does to the roadmap. The analysts ask whether their reports will break. A single talk that covers the technical design in depth answers none of them. Three openings, each leading with that person's question, do." },
        { t: "From and To",
          body: "Every communication that aims to influence has a starting point and a destination: what the audience thinks and does now, and what you need them to think and do afterwards. Writing both down exposes two common problems. Sometimes there is no 'do', in which case you have an update, not a case. Sometimes the gap is too large to cross in one conversation, and you need an intermediate step.",
          ex: "From: 'The platform team is a cost centre and should take a 20% cut like everyone else.' To: 'The platform is the reason three product teams release weekly. Protect its budget and fund the one missing piece.' Stated like this, the task is clear: the talk must connect the platform to something the audience already values, namely release speed." },

          body: "If you cannot state your message in a sentence, the audience will not be able to either. A good one-sentence message has a point of view and makes the stakes plain. It is a claim, not a topic. Test it by asking whether a listener could repeat it to a colleague tomorrow without your slides. Everything else in the communication exists to support that sentence.",
          ex: "Topic: 'An overview of our data quality initiative.' Message: 'A third of our pricing decisions use out-of-date data, and a $90K fix would stop about 400 wrong prices a week.' The first tells the audience what the next half hour is about. The second tells them what to think and what to do, and it survives being repeated in a corridor." },

          body: "Cutting is the hardest part and the most valuable. For each point, chart or slide, ask whether it serves the one idea for this audience. If it does not, move it to an appendix, however much work it took. Material you leave out is not wasted. It is what lets you answer questions with confidence. The audience judges you on clarity, not on volume.",

      id: "t3", num: "Module 3", title: "Narrative Structure for Technical Work",
      sub: "Situation, tension and resolution, and how to use them in proposals, incident reviews and roadmaps",
      time: "2–3 hrs",
      concepts: [
        { t: "Situation, Tension, Resolution",
          body: "Almost every story that works has three parts, a shape described since Aristotle: a beginning that sets the scene, a middle in which something is wrong or at risk, and an end that resolves it. In working life: here is where we are, here is the problem or opportunity, here is what we should do. Technical people tend to skip the tension and go from background to solution, which leaves the audience wondering why any of it matters.",
          ex: "Without tension: 'Our deployment system was built in 2019. We propose moving to a new one.' With tension: 'Our deployment system was built in 2019 for four teams. We now have nineteen. Last quarter it failed during six releases, and each failure cost a day. We propose moving to a new one.' The middle sentence is what makes the last one worth listening to." },
        { t: "Stakes and a Character",
          body: "Tension needs two things: someone it happens to, and something that will be lost if nothing changes. The character can be a customer, a colleague or a team, and should be specific enough to picture. The stakes should be counted where possible. The cost of doing nothing is the strongest and most neglected number in technical proposals, because inaction always looks free until it is priced.",
          ex: "Six engineers each lose about 14 hours a week to manual release work. Over 46 working weeks at $85 an hour, that is 14 × 6 × 46 × $85 = $328,440 a year for doing nothing. Put beside one engineer by name, who describes spending every Thursday babysitting a release, the number has both scale and a face." },
        { t: "Contrast: What Is and What Could Be",
          body: "Persuasive talks move back and forth between the present and a better possibility, and the gap between the two creates the wish to act. Describe today concretely, then describe the alternative just as concretely. Abstract benefits such as 'improved efficiency' create no gap. A specific day in the life, before and after, does. Analysts of well-known speeches, notably Nancy Duarte, have shown how consistently this pattern appears.",
          ex: "What is: 'A fix for a customer-facing bug takes nine days to reach production and needs four approvals.' What could be: 'The engineer who fixes it at ten o'clock sees it live by lunchtime, with the checks run automatically.' The audience can now feel the nine days, and the proposal has become a way to close a gap they can picture." },
        { t: "Using the Structure in Everyday Formats",
          body: "The three-part shape fits the documents you already write. A proposal is situation, the cost of the problem, the recommendation. An incident review is a timeline told as cause and effect, ending in what changes. A roadmap is a set of chapters, each resolving a tension for a customer. A status update is where we are, what is in the way, and what we need. When a senior audience wants the answer first, as taught in the Adaptive Leadership course, lead with the request and then use the story to earn it.",
          ex: "A status update with 14 bullet points becomes: 'We are two weeks behind because the supplier's interface changed without notice. We can recover one week by dropping the export feature from this release. We need a decision on that by Friday.' Situation, tension and resolution in three sentences, with the request impossible to miss." }

  W --> C["Contrast: what is, and what could be"]

      time: "2–3 hrs",
      concepts: [
        { t: "The One Number",
          body: "Data-rich presentations fail by offering too many numbers and explaining none. Choose the single figure that carries your message and make it meaningful by giving it a scale people can feel: per day, per customer, compared with something familiar. A percentage is often the least vivid way to express a quantity. Translate it into time, money or people.",
          ex: "A service is available 99.5% of the time, which sounds excellent. The other 0.5% of a year is 0.005 × 8,760 hours, about 44 hours. 'We are down for nearly two full days a year, usually in working hours' is the same fact, and it is the version that produces a conversation about whether that is acceptable." },
        { t: "One Chart, One Message",
          body: "A chart should make one point, and its title should say what the point is. Most charts are titled with a description of the axes and leave the audience to work out the conclusion, which they do differently from each other. State the conclusion in the title, highlight the part of the data that supports it and remove whatever does not: extra series, gridlines, decoration and unnecessary precision.",
          ex: "Descriptive title: 'Response times by region, Q1 to Q4', over a chart with six coloured lines. Message title: 'Response times doubled in Asia after the March change', with the Asia line in a strong colour, the other five in grey and a marker at March. The data is identical. Only the second chart can be understood in five seconds, and by everyone in the same way." },
        { t: "Pair the Number with a Person",
          body: "A statistic shows how big a problem is. A single example shows what it is like. Each is weak alone: the number is abstract and the anecdote may be unrepresentative. Together they are persuasive and fair. Choose an example that is typical of the data, say that it is typical, and let the number confirm that the person is not a one-off.",
          ex: "'We had 4,200 failed deliveries last month' is a figure to be noted. 'One of them was a customer who took three mornings off work for the same parcel and then cancelled a six-year account. Our data shows 4,200 failures last month, and one in nine of those customers left' gives the audience a face, a scale and a consequence in three sentences." },
        { t: "Honest Storytelling",
          body: "Persuasion with data carries a duty. Do not select only the figures that suit you, cut off an axis to exaggerate a change, quote a percentage without its base, or present an unusual case as typical. State what you do not know and how sure you are. Apart from being right, this is practical: an audience that catches one distortion will discount everything else you say, now and later.",
          ex: "'Errors fell by 50%' may mean a fall from 4 to 2 in a small sample, which could be chance. 'Errors fell from 4 to 2 in the first month. That is encouraging and too few to be sure, so we will report again after three months' is less striking and far more credible. Similarly, a chart whose axis starts at 96% makes a move from 97% to 98% look like a doubling." }

  P --> H{"Honest? Base stated, axis fair, uncertainty shown"}

    {

      sub: "Rough versions first, feedback that helps, tone, and fitting the story to the format",
      time: "2–3 hrs",
      concepts: [
        { t: "Rough First, and Fast",
          body: "The usual approach is to open the slide tool and polish for hours before anyone hears the idea. Do the reverse. Tell the story aloud in two minutes, or sketch it on a single page, before making anything. A rough version shows at once whether the structure works, and because you have invested little you are willing to change it. Polishing an argument that does not hold is the most expensive mistake in communication.",
          ex: "One presenter spends six hours on slides, presents and discovers that the audience disagreed with the premise on slide two. Another spends twenty minutes on a spoken draft, tries it on a colleague over coffee, learns that the premise needs evidence, and then spends three hours on slides that address it. The second used half the time and found the flaw before the meeting." },
        { t: "Feedback That Helps",
          body: "Asking 'what do you think?' produces politeness. Ask your listener to play the story back instead: what was my main point, what would you do next, and where did you get lost or bored? If what they repeat is not your one idea, the story needs work, however much they say they enjoyed it. Test on someone who resembles your real audience, not on the colleague who already knows the subject.",
          ex: "A draft is tried on three people. Asked for the main point, one says 'the system is old', another 'you want more people', and the third 'something about release speed'. The intended message was that a $90K change would halve release time. Nobody played it back, so the presenter moves that sentence to the opening and repeats it at the close. On the next test, all three get it." },
        { t: "Tone and Voice",
          body: "The same content can sound like a warning, an apology, a sales pitch or a recommendation from someone you trust. Tone is set by word choice, sentence length and how much certainty you claim. Match it to the audience and the stakes. In technical settings, plain words and calm confidence persuade better than excitement. Use your own voice. An audience can tell when someone is performing a style that is not theirs.",
          ex: "Hype: 'This game-changing platform will revolutionise how we deliver!' Apology: 'I know budgets are tight, and this might not be the right time, but…' Trusted adviser: 'This will cut release time roughly in half. It costs $90K and I am confident in the first number and less sure of the second. Here is why.' The third is the only one that sounds like someone whose recommendation you would act on." },
        { t: "Fitting the Format and the Time",
          body: "A story must be reshaped for its container. A document is read alone and must explain itself. A deck supports you while you speak and should carry less text. A two-minute verbal version is what you will actually get when the meeting overruns. Build the two-minute version first: if the story works there, it will expand easily. AI tools can help draft and critique, but the facts, the judgement and the voice have to be yours.",
          ex: "People speak at about 140 words a minute. Two minutes is roughly 280 words, about half a page. Ten minutes is about 1,400 words. A presenter who writes 3,000 words for a ten-minute slot will either rush or be cut off before the request. Writing the 280-word version first forces the choice of what matters, and it is ready when someone says 'we only have a couple of minutes'." }

  var UNIT_INDEX = {};
  COURSES.forEach(function(course){
    course.modules.forEach(function(m){
      UNIT_INDEX[course.key + "-" + m.id] = { course: course, def: m, localId: m.id };
    });
    UNIT_INDEX[course.key + "-" + course.capstone.id] = { course: course, def: course.capstone, localId: course.capstone.id };
  });
  function courseUnitIds(course){
    return course.modules.map(function(m){ return course.key + "-" + m.id; }).concat([course.key + "-" + course.capstone.id]);
  }
  function findCourse(key){ return COURSES.find(function(c){ return c.key===key; }); }

  // ---------- STATUS HELPERS ----------
  function moduleStatus(unitId){
    var entry = UNIT_INDEX[unitId];
    if (!entry) return "notstarted";
    var ms = getModState(entry.course.key, entry.localId);
    var def = entry.def;
    var rubricLen = def.rubric ? def.rubric.length : (def.assignment ? def.assignment.rubric.length : 0);
    var checkedCount = 0;
    for (var i=0;i<rubricLen;i++){ if (ms.assignment[i]) checkedCount++; }
    var assignmentDone = rubricLen>0 && checkedCount===rubricLen;
    if (ms.quizPassed && assignmentDone) return "done";
    if (ms.quizAnswers || checkedCount>0) return "progress";
    return "notstarted";
  }
  function courseProgress(course){
    var ids = courseUnitIds(course);
    var done = ids.filter(function(id){ return moduleStatus(id)==="done"; }).length;
    return { done: done, total: ids.length, pct: Math.round((done/ids.length)*100) };
  }
  function courseAllComplete(course){
    return courseUnitIds(course).every(function(id){ return moduleStatus(id)==="done"; });
  }
  // Correct answers needed to pass: ~70%, rounded so a 3-question quiz passes at 2/3.
  function passMark(quiz){ return Math.max(1, Math.round(quiz.length * 0.7)); }
  // Stamp the completion date when the last unit is finished; clear it if the course is reopened.
  function syncCompletion(course){
    var cp = getCourseProgress(course.key);
    var complete = courseAllComplete(course);
    if (complete && !cp.completedAt) cp.completedAt = new Date().toISOString();
    else if (!complete && cp.completedAt) cp.completedAt = null;
  }
  function resumeTarget(course){
    var ids = courseUnitIds(course);
    var t = ids.find(function(id){ return moduleStatus(id)==="progress"; }) || ids.find(function(id){ return moduleStatus(id)!=="done"; });
    return t || ids[0];
  }
  function nextUnit(){
    var best = null;
    COURSES.forEach(function(c){
      courseUnitIds(c).forEach(function(id){ if (!best && moduleStatus(id)==="progress") best = { course: c, id: id, label: "Continue" }; });
    });
    if (!best){
      COURSES.forEach(function(c){
        courseUnitIds(c).forEach(function(id){ if (!best && moduleStatus(id)==="notstarted") best = { course: c, id: id, label: "Start" }; });
      });
    }
    return best;
  }

  // ---------- DIAGRAMS (Mermaid) ----------
  var mermaidReady = false;
  function mountDiagrams(m){
    if (!m.diagrams) return;
    var holders = document.querySelectorAll(".diagram-holder");
    var nodes = [];
    holders.forEach(function(h){
      var idx = parseInt(h.getAttribute("data-idx"),10);
      var pre = document.createElement("pre");
      pre.className = "mermaid";
      pre.textContent = m.diagrams[idx].code;
      pre.setAttribute("data-idx", idx);
      h.appendChild(pre);
      nodes.push(pre);
    });
    function fallback(){
      nodes.forEach(function(n){
        var idx = parseInt(n.getAttribute("data-idx"),10);
        n.className = "diagram-fallback";
        n.textContent = m.diagrams[idx].code;
      });
    }
    if (window.mermaid){
      try {
        if (!mermaidReady){ mermaid.initialize({ startOnLoad:false, securityLevel:"strict", theme:"neutral" }); mermaidReady = true; }
        mermaid.run({ nodes: nodes }).catch(fallback);
      } catch(e){ fallback(); }
    } else { fallback(); }
  }

  function sideItem(id, ico, label, status, route){

  function renderSidebar(course, route){

  // Adds .in when the element scrolls into view, then runs the callback once.
  function revealOnView(el, cb){
    function go(){ el.classList.add("in"); el.setAttribute("data-revealed", "1"); if (cb) cb(); }
    if (REDUCED_MOTION || !("IntersectionObserver" in window)){ go(); return; }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if (e.isIntersecting){ io.disconnect(); go(); } });
    }, { threshold: 0.2 });
    io.observe(el);
  }
  function r1(n){ return Math.round(n * 10) / 10; }

  function layoutOrbit(o){
    var svg = o.querySelector(".orbit-lines");

    var w = o.clientWidth;
    var compact = w < 760;
    o.classList.toggle("compact", compact);
    if (compact){
      nodes.forEach(function(n){ n.style.left = ""; n.style.top = ""; n.classList.remove("lab-top", "lab-bottom", "lab-left", "lab-right"); });
      svg.innerHTML = "";
      return;
    }
    var hgt = o.clientHeight, cx = w / 2, cy = hgt / 2;
    var rx = Math.min(w / 2 - 205, 420), ry = hgt / 2 - 112;
    var n = nodes.length;
    var out = "<ellipse class='orb-ring' cx='"+r1(cx)+"' cy='"+r1(cy)+"' rx='"+r1(rx)+"' ry='"+r1(ry)+"'/>";
    out += "<ellipse class='orb-ring inner' cx='"+r1(cx)+"' cy='"+r1(cy)+"' rx='"+r1(rx * 0.55)+"' ry='"+r1(ry * 0.55)+"'/>";
    var dotPaths = [];
    nodes.forEach(function(nd, i){
      var a = (-90 + i * 360 / n) * Math.PI / 180;
      var x = cx + rx * Math.cos(a), y = cy + ry * Math.sin(a);
      nd.style.left = r1(x) + "px";
      nd.style.top = r1(y) + "px";
      // Put each label on the outside of its bubble so no line crosses it.
      var side = Math.sin(a) < -0.6 ? "lab-top" : (Math.sin(a) > 0.6 ? "lab-bottom" : (Math.cos(a) > 0 ? "lab-right" : "lab-left"));
      nd.classList.remove("lab-top", "lab-bottom", "lab-left", "lab-right");
      nd.classList.add(side);
      var dx = x - cx, dy = y - cy, len = Math.sqrt(dx * dx + dy * dy), ux = dx / len, uy = dy / len;
      var sx = cx + ux * 80, sy = cy + uy * 80, ex = x - ux * 50, ey = y - uy * 50;
      var bend = (i % 2 ? 1 : -1) * 18;
      var qx = (sx + ex) / 2 - uy * bend, qy = (sy + ey) / 2 + ux * bend;
      var col = nd.getAttribute("data-color");
      out += "<path class='ln' pathLength='1' style='--i:"+i+"' stroke='"+col+"' d='M"+r1(sx)+" "+r1(sy)+" Q"+r1(qx)+" "+r1(qy)+" "+r1(ex)+" "+r1(ey)+"'/>";
      dotPaths.push({ col: col, d: "M"+r1(ex)+" "+r1(ey)+" Q"+r1(qx)+" "+r1(qy)+" "+r1(sx)+" "+r1(sy) });
    });
    svg.setAttribute("viewBox", "0 0 " + w + " " + hgt);
    svg.innerHTML = out;
    o._dotPaths = dotPaths;
    if (o.getAttribute("data-revealed") === "1") addOrbitDots(o);
  }
  // Small particles travelling from each area into the leader at the centre.
  function addOrbitDots(o){
    if (REDUCED_MOTION || !o._dotPaths) return;
    var svg = o.querySelector(".orbit-lines");
    var dots = "";
    o._dotPaths.forEach(function(p, i){
      var dur = (2.4 + (i % 3) * 0.4).toFixed(1) + "s", begin = (i * 0.35).toFixed(2) + "s";
      dots += "<circle r='3.5' fill='"+p.col+"' opacity='0'><animateMotion dur='"+dur+"' begin='"+begin+"' repeatCount='indefinite' path='"+p.d+"'/><animate attributeName='opacity' values='0;.9;.9;0' keyTimes='0;.15;.8;1' dur='"+dur+"' begin='"+begin+"' repeatCount='indefinite'/></circle>";
    });

  }

    var len = e.def.rubric ? e.def.rubric.length : e.def.assignment.rubric.length;

  function journeySteps(course){
    var ids = courseUnitIds(course);
    var modIds = ids.slice(0, course.modules.length);
    var cp = getCourseProgress(course.key);
    var visited = cp.visited || {};
    var started = ids.filter(function(id){ return moduleStatus(id) !== "notstarted"; }).length;

    return [
      { ico: "flag", t: "Start", x: "Pick a real challenge from your work to carry through the course", done: started > 0, stat: started > 0 ? "Started" : "Not yet", href: ids[0] },
      { ico: "book", t: "Learn the concepts", x: "Short concepts, each with a worked example", done: modsStarted === modIds.length, stat: modsStarted + " of " + modIds.length + " modules", href: resume },
      { ico: "edit", t: "Apply to real work", x: "Cases, assignments and a capstone on your own situation", done: applied === ids.length, stat: applied + " of " + ids.length + " applied", href: applyTarget },
      { ico: "quiz", t: "Check understanding", x: "A quick quiz at the end of every unit", done: passed === ids.length, stat: passed + " of " + ids.length + " passed", href: quizTarget },
      { ico: "bookmark", t: "Go deeper", x: "Books, podcasts, courses and a post to share what you learned", done: deeper === 2, stat: deeper + " of 2 explored", href: visited.references ? course.key + "-bonus" : course.key + "-references" },

  function journeyHtml(course){
    var steps = journeySteps(course);
    var current = steps.findIndex(function(s){ return !s.done; });
    if (current === -1) current = steps.length;
    var h = "<section class='panel journey-sec'><div class='j-head'><h2>Your learning journey</h2><p class='j-sub'>Every step builds on the last. You finish a better leader than you started.</p></div>";
    h += "<div class='journey' id='journey' data-current='"+current+"'><svg class='j-svg' aria-hidden='true'></svg>";

      h += "<a class='j-step "+cls+(i % 2 ? " low" : "")+(s.final ? " final" : "")+"' href='#"+s.href+"' style='--i:"+i+"'>";

    return h;

  function smoothPath(pts){
    if (!pts.length) return "";
    var d = "M" + r1(pts[0].x) + " " + r1(pts[0].y);
    for (var i = 1; i < pts.length; i++){
      var a = pts[i - 1], b = pts[i];
      if (Math.abs(b.y - a.y) > Math.abs(b.x - a.x)){
        var my = (a.y + b.y) / 2;
        d += " C" + r1(a.x) + " " + r1(my) + " " + r1(b.x) + " " + r1(my) + " " + r1(b.x) + " " + r1(b.y);
      } else {
        var mx = (a.x + b.x) / 2;
        d += " C" + r1(mx) + " " + r1(a.y) + " " + r1(mx) + " " + r1(b.y) + " " + r1(b.x) + " " + r1(b.y);
      }
    }
    return d;
  }
  // Draws the winding path through the steps, the completed part in the course colours,
  // and a marker that travels to the learner's current step.
  function layoutJourney(j, animate){
    var svg = j.querySelector(".j-svg");
    var box = j.getBoundingClientRect();
    // Layout offsets ignore the steps' entrance transforms, so the path lands on the final positions.
    var pts = Array.prototype.map.call(j.querySelectorAll(".j-dot"), function(d){
      var st = d.parentNode;
      return { x: st.offsetLeft + d.offsetLeft + d.offsetWidth / 2, y: st.offsetTop + d.offsetTop + d.offsetHeight / 2 };
    });
    if (pts.length < 2) return;
    var current = parseInt(j.getAttribute("data-current"), 10);
    var reach = Math.min(current, pts.length - 1);
    var gid = "jg" + (++svgCounter), pid = "jp" + svgCounter;
    var last = pts[pts.length - 1];
    var style = getComputedStyle(j);
    var c1 = style.getPropertyValue("--cc").trim() || "#3556d8", c2 = style.getPropertyValue("--cc2").trim() || "#7c3aed";
    var s = "<defs><linearGradient id='"+gid+"' gradientUnits='userSpaceOnUse' x1='"+r1(pts[0].x)+"' y1='"+r1(pts[0].y)+"' x2='"+r1(last.x)+"' y2='"+r1(last.y)+"'><stop offset='0' stop-color='"+c1+"'/><stop offset='1' stop-color='"+c2+"'/></linearGradient></defs>";
    s += "<path class='j-base' d='"+smoothPath(pts)+"'/>";
    if (reach > 0) s += "<path class='j-prog' id='"+pid+"' stroke='url(#"+gid+")' d='"+smoothPath(pts.slice(0, reach + 1))+"'/>";
    var end = pts[reach];
    s += "<g class='j-marker' opacity='0'><circle r='15' fill='"+c1+"' opacity='.18'><animate attributeName='r' values='11;19;11' dur='2s' repeatCount='indefinite'/></circle><circle r='8' fill='#fff' stroke='"+c1+"' stroke-width='3'/><circle r='3' fill='"+c1+"'/>";
    if (reach > 0) s += "<animateMotion dur='1.4s' begin='indefinite' fill='freeze' calcMode='spline' keyPoints='0;1' keyTimes='0;1' keySplines='.4 0 .2 1'><mpath href='#"+pid+"'/></animateMotion>";
    s += "</g>";
    svg.setAttribute("viewBox", "0 0 " + r1(box.width) + " " + r1(box.height));
    svg.innerHTML = s;
    var prog = svg.querySelector(".j-prog");
    var marker = svg.querySelector(".j-marker");
    var motion = marker.querySelector("animateMotion");
    function settle(){ marker.setAttribute("transform", "translate(" + r1(end.x) + " " + r1(end.y) + ")"); marker.setAttribute("opacity", "1"); }
    if (!prog){ settle(); return; }
    var L = prog.getTotalLength();
    prog.style.strokeDasharray = L;
    if (!animate || REDUCED_MOTION){
      prog.style.strokeDashoffset = 0;
      if (motion) motion.parentNode.removeChild(motion);
      settle();
      return;
    }
    prog.style.strokeDashoffset = L;
    prog.getBoundingClientRect();
    requestAnimationFrame(function(){ prog.style.strokeDashoffset = 0; });
    setTimeout(function(){
      marker.setAttribute("opacity", "1");
      try { motion.beginElement(); } catch(e){ motion.parentNode.removeChild(motion); settle(); }
    }, 150);
  }
  function mountJourney(){
    var j = document.getElementById("journey");
    if (!j) return;
    layoutJourney(j, false);
    j.querySelector(".j-marker").setAttribute("opacity", "0");
    var prog = j.querySelector(".j-prog");
    if (prog && !REDUCED_MOTION) prog.style.strokeDashoffset = prog.style.strokeDasharray;
    // Wait for the steps' entrance animation before drawing the path through them.
    revealOnView(j, function(){ setTimeout(function(){ if (document.body.contains(j)) layoutJourney(j, true); }, REDUCED_MOTION ? 0 : 900); });
  }
