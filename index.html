<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Hub for Technical Leaders</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f7fb;
    --panel: #ffffff;
    --ink: #121826;
    --ink2: #475166;
    --ink3: #7a8499;
    --line: #e2e7f0;
    --brand: #3556d8;
    --brand2: #7c3aed;
    --good: #128a4a;
    --good-soft: #e6f7ee;
    --warn: #b45309;
    --warn-soft: #fff3df;
    --bad: #c0264d;
    --bad-soft: #fdecf1;
    --radius: 16px;
    --shadow-sm: 0 1px 2px rgba(16,24,40,.06);
    --shadow: 0 6px 22px rgba(16,24,40,.08);
    --shadow-lg: 0 14px 40px rgba(16,24,40,.14);
    --cc: #3556d8;
    --cc2: #7c3aed;
    --topbar-h: 60px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .ico { flex-shrink: 0; vertical-align: middle; }
  h1,h2,h3,h4 { margin: 0; }

  /* ---------- Top bar ---------- */
  #topbar {
    position: sticky; top: 0; z-index: 60; height: var(--topbar-h);
    background: rgba(255,255,255,.96); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; padding: 0 20px;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
  .logo-mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
  .top-links a { font-size: 14px; font-weight: 600; color: var(--ink2); padding: 8px 10px; border-radius: 8px; }
  .top-links a:hover { background: var(--bg); color: var(--ink); }
  .spacer { flex: 1; }
  .top-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--ink2); background: var(--bg); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
  .menu-btn { display: none; background: none; border: none; padding: 6px; border-radius: 8px; cursor: pointer; color: var(--ink); }
  body.has-side .menu-btn { display: none; }

  /* ---------- Layout ---------- */
  #layout { display: flex; align-items: flex-start; }
  #sidebar {
    display: none; width: 304px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--line);
    position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); overflow-y: auto; padding: 18px 14px 28px;
  }
  body.has-side #sidebar { display: block; }
  #main { flex: 1; min-width: 0; padding: 28px 40px 90px; max-width: 1060px; margin: 0 auto; }
  #main.wide { max-width: 1180px; }

  /* ---------- Sidebar ---------- */
  .side-back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--ink2); padding: 6px 8px; border-radius: 8px; margin-bottom: 10px; }
  .side-back:hover { background: var(--bg); color: var(--ink); }
  .side-course { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 14px; background: #fff; }
  .side-art { height: 84px; }
  .side-body { padding: 12px 14px 14px; }
  .side-title { font-weight: 800; font-size: 14px; line-height: 1.3; margin-bottom: 8px; }
  .progress-mini-label { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink3); margin-bottom: 5px; font-weight: 600; }
  .progress-track { height: 7px; border-radius: 6px; background: var(--line); overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--cc), var(--cc2)); border-radius: 6px; transition: width .4s ease; }
  .side-label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink3); margin: 16px 10px 6px; font-weight: 800; }
  .side-item { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 10px; font-size: 13.5px; font-weight: 600; color: var(--ink2); border: 1px solid transparent; }
  .side-item:hover { background: var(--bg); color: var(--ink); }
  .side-item.active { background: color-mix(in srgb, var(--cc) 10%, white); border-color: color-mix(in srgb, var(--cc) 25%, white); color: var(--cc); }
  .side-item .lbl { flex: 1; line-height: 1.3; }
  .s-mark { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #cdd4e1; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; color: #fff; }
  .s-mark.done { background: var(--good); border-color: var(--good); }
  .s-mark.prog { border-color: var(--warn); background: linear-gradient(90deg, var(--warn) 50%, transparent 50%); }
  .s-ico { width: 20px; display: inline-flex; justify-content: center; color: var(--ink3); }

  /* ---------- Buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--cc); color: #fff; border: 1px solid transparent; padding: 11px 20px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn:hover { filter: brightness(.92); }
  .btn.light { background: #fff; color: #1e2a78; }
  .btn.ghost { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.45); }
  .btn.ghost:hover { background: rgba(255,255,255,.24); }
  .btn.outline { background: #fff; color: var(--cc); border-color: color-mix(in srgb, var(--cc) 35%, white); }
  .btn.outline:hover { background: color-mix(in srgb, var(--cc) 8%, white); }
  .btn.sm { padding: 8px 14px; font-size: 13px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* ---------- Home ---------- */
  .hero { position: relative; overflow: hidden; border-radius: 22px; background: linear-gradient(120deg, #1b2670 0%, #3556d8 55%, #7c3aed 100%); color: #fff; padding: 46px 44px; margin-bottom: 26px; min-height: 280px; display: flex; align-items: center; box-shadow: var(--shadow-lg); }
  .hero-art { position: absolute; right: 0; top: 0; height: 100%; width: 58%; }
  .hero-art svg { width: 100%; height: 100%; display: block; }
  .hero-copy { position: relative; z-index: 2; max-width: 540px; }
  .hero-tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); padding: 5px 12px; border-radius: 999px; }
  .hero h1 { font-size: 40px; line-height: 1.1; margin: 14px 0 12px; letter-spacing: -.025em; }
  .hero p { font-size: 16px; line-height: 1.55; opacity: .93; margin: 0 0 22px; }
  .hero-cta { display: flex; gap: 10px; flex-wrap: wrap; }

  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 26px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow-sm); }
  .stat .stat-ico { width: 42px; height: 42px; border-radius: 12px; background: color-mix(in srgb, var(--brand) 10%, white); color: var(--brand); display: inline-flex; align-items: center; justify-content: center; }
  .stat b { font-size: 22px; display: block; line-height: 1.1; }
  .stat span { font-size: 12.5px; color: var(--ink3); font-weight: 600; }

  .section-title { font-size: 22px; font-weight: 800; letter-spacing: -.015em; margin: 6px 0 14px; }
  .continue-card { display: flex; align-items: center; gap: 16px; background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--cc); border-radius: 14px; padding: 16px 18px; margin-bottom: 26px; box-shadow: var(--shadow-sm); }
  .continue-card:hover { box-shadow: var(--shadow); }
  .continue-card .cc-text { flex: 1; min-width: 0; }
  .eyebrow { font-size: 11.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--cc); }
  .continue-card .cc-title { font-weight: 800; font-size: 17px; margin: 2px 0; }
  .continue-card .cc-sub { font-size: 13px; color: var(--ink3); }
  .go { width: 38px; height: 38px; border-radius: 50%; background: var(--cc); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

  .course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
  .course-card { background: #fff; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; box-shadow: var(--shadow-sm); transition: transform .15s ease, box-shadow .15s ease; }
  .course-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
  .course-card:focus-visible { outline: 3px solid var(--cc); outline-offset: 3px; }
  .cc-art { position: relative; height: 150px; }
  .cc-badge { position: absolute; left: 14px; top: 14px; background: rgba(255,255,255,.92); color: var(--ink); font-size: 11.5px; font-weight: 800; padding: 4px 10px; border-radius: 999px; }
  .cc-body { padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .cc-meta { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink3); font-weight: 600; }
  .course-card h3 { font-size: 18px; line-height: 1.25; letter-spacing: -.01em; }
  .cc-tag { font-size: 13.5px; color: var(--ink2); margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 11.5px; font-weight: 700; color: var(--cc); background: color-mix(in srgb, var(--cc) 10%, white); padding: 4px 10px; border-radius: 999px; }
  .cc-prog { margin-top: auto; padding-top: 6px; }
  .cc-cta { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; color: var(--cc); margin-top: 8px; }

  .profile-card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; box-shadow: var(--shadow-sm); }
  .profile-card .avatar { width: 52px; height: 52px; font-size: 20px; }
  .profile-card .pc-text { flex: 1; min-width: 220px; }
  .profile-card h3 { font-size: 16px; margin-bottom: 2px; }
  .profile-card p { margin: 0; font-size: 13px; color: var(--ink3); }
  input.name-input { font-size: 15px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); width: 100%; max-width: 320px; font-family: inherit; background: var(--bg); }
  input.name-input:focus { outline: 2px solid var(--brand); background: #fff; }
  .foot-actions { display: flex; justify-content: flex-end; margin-top: 18px; }
  .link-btn { background: none; border: none; color: var(--ink3); font-size: 12.5px; cursor: pointer; text-decoration: underline; font-family: inherit; }
  .link-btn:hover { color: var(--bad); }

  /* ---------- Course page ---------- */
  .crumbs { font-size: 13px; color: var(--ink3); font-weight: 600; margin-bottom: 12px; }
  .crumbs a:hover { color: var(--cc); }
  .c-hero { position: relative; overflow: hidden; border-radius: 22px; background: linear-gradient(120deg, var(--cc), var(--cc2)); color: #fff; padding: 38px 40px; margin-bottom: 22px; box-shadow: var(--shadow-lg); }
  .c-hero .art { position: absolute; right: 0; top: 0; height: 100%; width: 46%; }
  .c-hero .art svg { width: 100%; height: 100%; display: block; }
  .c-hero .copy { position: relative; z-index: 2; max-width: 600px; }
  .c-hero h1 { font-size: 32px; line-height: 1.15; letter-spacing: -.02em; margin: 10px 0; }
  .c-hero p { font-size: 15.5px; opacity: .95; margin: 0 0 18px; line-height: 1.55; }
  .c-hero .tagline-pill { display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); padding: 4px 12px; border-radius: 999px; }
  .c-stats { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; font-size: 13.5px; font-weight: 700; }
  .c-stats span { display: inline-flex; align-items: center; gap: 7px; }
  .c-prog-line { max-width: 360px; margin-top: 16px; }
  .c-prog-line .progress-mini-label { color: rgba(255,255,255,.9); }
  .c-prog-line .progress-track { background: rgba(255,255,255,.28); }
  .c-prog-line .progress-fill { background: #fff; }
  .note-box { font-size: 13px; color: var(--ink2); background: #fff; border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 20px; }

  .two-col { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; margin-bottom: 22px; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; box-shadow: var(--shadow-sm); }
  .panel h2 { font-size: 19px; font-weight: 800; margin-bottom: 14px; letter-spacing: -.01em; }
  .learn-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .learn-list li { display: flex; gap: 10px; font-size: 14px; color: var(--ink2); line-height: 1.45; }
  .learn-list li .ico { color: var(--good); margin-top: 2px; }

  .syl-item { display: flex; align-items: center; gap: 16px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow-sm); }
  .syl-item:hover { box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--cc) 35%, white); }
  .syl-text { flex: 1; min-width: 0; }
  .syl-num { font-size: 11.5px; font-weight: 800; color: var(--cc); letter-spacing: .07em; text-transform: uppercase; }
  .syl-title { font-weight: 800; font-size: 16px; line-height: 1.3; }
  .syl-sub { font-size: 13px; color: var(--ink3); margin-top: 2px; }
  .syl-meta { font-size: 12.5px; color: var(--ink3); display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
  .thumb { display: inline-flex; align-items: center; justify-content: center; border-radius: 14px; background: linear-gradient(135deg, var(--cc), var(--cc2)); color: #fff; flex-shrink: 0; }
  .status-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 800; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .status-pill.notstarted { background: var(--bg); color: var(--ink3); border: 1px solid var(--line); }
  .status-pill.progress { background: var(--warn-soft); color: var(--warn); }
  .status-pill.done { background: var(--good-soft); color: var(--good); }
  .status-pill.locked { background: var(--bg); color: var(--ink3); border: 1px solid var(--line); }

  /* ---------- Unit page ---------- */
  .unit-head { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 14px; }
  .unit-head h1 { font-size: 29px; line-height: 1.15; letter-spacing: -.02em; margin: 4px 0 6px; }
  .unit-head p { margin: 0 0 10px; color: var(--ink2); font-size: 15px; max-width: 680px; }
  .meta-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .meta-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--ink2); background: #fff; border: 1px solid var(--line); padding: 5px 11px; border-radius: 999px; }
  .subnav { position: sticky; top: var(--topbar-h); z-index: 30; background: rgba(245,247,251,.94); backdrop-filter: blur(8px); padding: 10px 0; margin: 0 0 14px; display: flex; gap: 8px; overflow-x: auto; border-bottom: 1px solid var(--line); }
  .subnav button { font-family: inherit; font-size: 13px; font-weight: 700; color: var(--ink2); background: #fff; border: 1px solid var(--line); padding: 7px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .subnav button:hover { color: var(--cc); border-color: color-mix(in srgb, var(--cc) 40%, white); }
  .sec { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 24px 26px; margin-bottom: 20px; box-shadow: var(--shadow-sm); scroll-margin-top: 130px; }
  .sec-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .sec-head h3 { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
  .sec-ico { width: 34px; height: 34px; border-radius: 10px; background: color-mix(in srgb, var(--cc) 12%, white); color: var(--cc); display: inline-flex; align-items: center; justify-content: center; }
  .sec p { font-size: 15px; line-height: 1.65; color: #2a3142; margin: 0 0 12px; }
  .sec h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); margin: 18px 0 8px; font-weight: 800; }
  .concept { display: flex; gap: 16px; padding: 18px 0; border-top: 1px solid var(--line); }
  .concept:first-of-type { border-top: none; padding-top: 4px; }
  .concept-num { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--cc), var(--cc2)); color: #fff; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .concept h4 { font-size: 16.5px; text-transform: none; letter-spacing: -.005em; color: var(--ink); margin: 3px 0 6px; }
  .example { background: color-mix(in srgb, var(--cc) 7%, white); border-left: 4px solid var(--cc); border-radius: 10px; padding: 12px 15px; font-size: 14px; line-height: 1.6; color: #232a3b; margin-top: 8px; }
  .example .tag { display: block; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--cc); margin-bottom: 3px; }
  .sec.case { border-left: 5px solid var(--cc); }
  .task-box { background: var(--bg); border-radius: 12px; padding: 14px 16px; margin-top: 8px; }
  .task-box .tag { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--cc); }
  .task-box p { margin: 4px 0 0; }
  .sec.everyday { background: linear-gradient(180deg, color-mix(in srgb, var(--cc) 6%, white), #fff); }
  .deliverable { background: color-mix(in srgb, var(--cc) 7%, white); border: 1px solid color-mix(in srgb, var(--cc) 20%, white); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .deliverable .tag { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--cc); }
  .deliverable p { margin: 4px 0 0; }
  .num-row { display: flex; gap: 10px; padding: 8px 0; font-size: 14.5px; color: #2a3142; border-bottom: 1px dashed var(--line); }
  .num-row:last-child { border-bottom: none; }
  .num-row b { color: var(--cc); min-width: 20px; }
  .check-head { display: flex; align-items: center; gap: 12px; margin: 6px 0 8px; }
  .check-head .progress-track { flex: 1; }
  .check-count { font-size: 12.5px; font-weight: 800; color: var(--ink2); }
  .rubric-row { display: flex; align-items: flex-start; gap: 12px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; cursor: pointer; background: #fff; }
  .rubric-row:hover { background: var(--bg); }
  .rubric-row input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--cc); flex-shrink: 0; }
  .rubric-row span { font-size: 14px; line-height: 1.5; color: #2a3142; }
  .reflect-list { margin: 0; padding-left: 22px; }
  .reflect-list li { font-size: 15px; line-height: 1.6; margin-bottom: 10px; color: #2a3142; padding-left: 4px; }
  .quiz-q { padding: 16px 0; border-top: 1px solid var(--line); }
  .quiz-q:first-of-type { border-top: none; padding-top: 0; }
  .qtext { font-weight: 700; font-size: 15px; margin-bottom: 10px; line-height: 1.45; }
  .quiz-opt { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border-radius: 10px; margin-bottom: 7px; cursor: pointer; border: 1px solid var(--line); font-size: 14px; background: #fff; }
  .quiz-opt:hover { border-color: color-mix(in srgb, var(--cc) 45%, white); background: color-mix(in srgb, var(--cc) 5%, white); }
  .quiz-opt input { margin-top: 3px; accent-color: var(--cc); }
  .quiz-opt.correct { background: var(--good-soft); border-color: #a9dfc0; }
  .quiz-opt.incorrect { background: var(--bad-soft); border-color: #f2b9c8; }
  .quiz-result { margin-top: 14px; padding: 13px 16px; border-radius: 12px; font-size: 14px; font-weight: 700; }
  .quiz-result.pass { background: var(--good-soft); color: var(--good); }
  .quiz-result.fail { background: var(--bad-soft); color: var(--bad); }
  .nav-buttons { display: flex; justify-content: space-between; gap: 10px; margin-top: 26px; }
  .diagram-card pre.mermaid { background: #fff; text-align: center; margin: 0; overflow-x: auto; font-size: 13px; }
  .diagram-fallback { white-space: pre; font-size: 12px; background: var(--bg); border: 1px dashed var(--line); padding: 12px; overflow-x: auto; border-radius: 8px; margin: 0; }

  /* ---------- Certificate / bonus ---------- */
  .cert-wrap { display: flex; justify-content: center; padding: 10px 0 20px; }
  .certificate { position: relative; width: 100%; max-width: 760px; border-radius: 20px; padding: 54px 56px; text-align: center; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow-lg); overflow: hidden; }
  .certificate::before { content: ""; position: absolute; inset: 12px; border: 2px solid var(--cc); border-radius: 14px; opacity: .55; pointer-events: none; }
  .certificate .ribbon { position: absolute; left: 0; top: 0; right: 0; height: 8px; background: linear-gradient(90deg, var(--cc), var(--cc2)); }

(function(){
  "use strict";

  var STORAGE_KEY = "learning_hub_progress_v1";
  var OLD_STORAGE_KEY = "fdi_course_progress_v1";

  function defaultState(){ return { learnerName: "", progress: {} }; }
  function defaultCourseProgress(){ return { modules: {}, completedAt: null }; }

  function isObj(v){ return !!v && typeof v === "object" && !Array.isArray(v); }
  // Saved JSON may be hand-edited or from an older build; coerce it to the expected shape.
  function normalizeState(s){
    var out = defaultState();
    if (!isObj(s)) return out;
    if (typeof s.learnerName === "string") out.learnerName = s.learnerName;
    if (isObj(s.progress)){
      Object.keys(s.progress).forEach(function(k){
        var cp = s.progress[k];
        if (!isObj(cp)) return;
        var mods = {};
        if (isObj(cp.modules)){
          Object.keys(cp.modules).forEach(function(id){
            var ms = cp.modules[id];
            if (!isObj(ms)) return;
            mods[id] = {
              assignment: isObj(ms.assignment) ? ms.assignment : {},
              quizAnswers: Array.isArray(ms.quizAnswers) ? ms.quizAnswers : null,
              quizScore: typeof ms.quizScore === "number" ? ms.quizScore : null,
              quizPassed: ms.quizPassed === true
            };
          });
        }
        out.progress[k] = { modules: mods, completedAt: typeof cp.completedAt === "string" ? cp.completedAt : null };
      });
    }
    return out;
  }

  function loadState(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return normalizeState(JSON.parse(raw));
      var old = localStorage.getItem(OLD_STORAGE_KEY);
      if (old){
        var oldState = JSON.parse(old);
        var migrated = defaultState();
        migrated.learnerName = oldState.learnerName || "";
        migrated.progress.fin = { modules: oldState.modules || {}, completedAt: oldState.completedAt || null };
        return normalizeState(migrated);
      }
    } catch(e){}
    return defaultState();
  }
  function saveState(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
  }
  var state = loadState();

  function getCourseProgress(courseKey){
    if (!state.progress[courseKey]) state.progress[courseKey] = defaultCourseProgress();
    return state.progress[courseKey];
  }
  function getModState(courseKey, localId){
    var cp = getCourseProgress(courseKey);
    if (!cp.modules[localId]) cp.modules[localId] = { assignment: {}, quizAnswers: null, quizScore: null, quizPassed: false };
    return cp.modules[localId];
  }

  // ============================================================
  // COURSE 1: FINANCE & DATA INTELLIGENCE
  // ============================================================
  var FIN_MODULES = [
    {
      id: "m1", num: "Module 1", title: "Financial Dashboards",
      sub: "Building and interpreting executive-level KPI dashboards",
      time: "2–3 hrs",
      concepts: [
        { t: "Leading vs. Lagging Indicators",
          body: "A lagging indicator tells you what already happened (revenue, churn last quarter). A leading indicator predicts what's about to happen (trial-to-paid conversion, pipeline velocity, usage-days per seat). Executives need both, but they act on leading indicators and report on lagging ones.",
          ex: "A SaaS company's Q3 revenue (lagging) was $2.4M, flat vs Q2. But trial-to-paid conversion (leading) dropped from 18% to 11% starting in July — flat revenue looks fine, but the leading indicator says Q4 revenue is about to fall." },
        { t: "Signal vs. Noise — One Dashboard, One Decision",
          body: "A dashboard with 40 metrics is harder to act on than one with 6. Every dashboard should map to a specific decision a specific person needs to make — the same discipline as an alerting layer that only pages on the 3–5 signals that predict an outage, not every log line.",
          ex: "A VP of Sales 'will we hit target' dashboard needs exactly: pipeline coverage ratio, win rate trend, avg deal cycle time, and days left in quarter. Everything else is noise for that decision." },
        { t: "The Metric Pyramid (North Star → Drivers → Inputs)",
          body: "Executive dashboards cascade: one North Star metric, 3–5 driver metrics, and the operational inputs teams control day to day. Like a medallion architecture: raw data (bronze) rolls into curated driver metrics (silver), which roll into the one gold-layer number leadership watches.",

        { t: "Common Executive KPI Vocabulary",
          body: "CAC, LTV, LTV:CAC ratio (3:1+ is healthy), Gross Margin, Burn Multiple (net burn ÷ net new ARR — lower is more efficient), Rule of 40 (growth % + profit margin % should exceed 40).",
          ex: "35% YoY growth with -10% operating margin → Rule of 40 score = 35 + (-10) = 25, below the 40 threshold: growth isn't yet capital-efficient." }
      ],
      caseTitle: "SaaS — The Dashboard That Missed the Warning",
      caseText: "A mid-market SaaS company's board dashboard shows ARR growing steadily at 22% YoY for three quarters — green across the board. But NPS among accounts due for renewal has quietly dropped from 42 to 19, and usage-days per seat is down 15% among enterprise accounts. None of this is on the dashboard, which is built entirely on lagging revenue and logo-count metrics.",

        { q: "The 'One Dashboard, One Decision' rule means an ideal executive dashboard should:",
          opts: ["Include as many metrics as possible for completeness","Map to a specific decision with a small number of metrics","Only show revenue metrics","Be updated once a year"], correct: 1 },
        { q: "In the Metric Pyramid, what sits at the top?",

        { q: "A company grows ARR 35% YoY with -10% operating margin. What is its Rule of 40 score?",

    {
      id: "m2", num: "Module 2", title: "Managerial Accounting",

      concepts: [
        { t: "Fixed vs. Variable Costs",
          body: "Fixed costs don't change with volume (a reserved-capacity commitment, a platform license, salaried staff). Variable costs scale with usage (on-demand compute, per-call fees, commissions). The mix determines operating leverage.",
          ex: "A platform team pays $40K/mo fixed licensing plus $0.02/GB variable compute. At 2M GB/mo, cost per GB = $0.04. At 10M GB/mo, cost per GB drops to $0.024 — the same reserved-vs-on-demand tradeoff you navigate in cloud architecture." },
        { t: "Contribution Margin",
          body: "Contribution margin = Revenue per unit − Variable cost per unit. It's the number that should drive 'sell more of X or Y' decisions, not gross revenue.",

      caseText: "A DTC skincare brand sells a $45 serum (COGS $12, $8 CAC, $3 fulfillment) and a $22 cleanser (COGS $5, $4 CAC, $3 fulfillment). On revenue alone the serum looks like the star product, and leadership is deciding which to feature in the next paid campaign.",

        { q: "A cost that stays the same regardless of production volume is a:", opts: ["Variable cost","Fixed cost","Marginal cost","Opportunity cost"], correct: 1 },
        { q: "CAC Payback Period tells you:", opts: ["Lifetime profit per customer","How many months to earn back acquisition cost","Total marketing budget","The churn rate"], correct: 1 },
        { q: "Zero-based budgeting differs from incremental budgeting because it:", opts: ["Automatically increases budgets by inflation","Requires every line item justified from zero each cycle","Only applies to capital expenses","Eliminates the need for budgets"], correct: 1 }
      ]
    },
    {
      id: "m3", num: "Module 3", title: "Financial Planning",
      sub: "Forecasting, scenario planning, and capital allocation",
      time: "2–4 hrs",
      concepts: [
        { t: "Top-Down vs. Bottom-Up Forecasting",
          body: "Top-down starts from a market-size number and works down. Bottom-up starts from operational drivers and works up. Bottom-up is more defensible — it's built on inputs you can monitor and influence, like building from validated source-system data rather than a spreadsheet guess.",
          ex: "Top-down: '$4B market, we'll get 1% = $40M.' Bottom-up: '6 new reps, ramping to 2 deals/mo at $15K ACV → ~$8-9M new ARR.' The bottom-up number is grounded in capacity you can actually staff." },
        { t: "Scenario Planning (Best / Base / Worst)",
          body: "A single-point forecast pretends the future is certain. Scenario planning models 3+ plausible futures so decisions can be stress-tested against downside cases — the financial equivalent of load-testing against peak, not average, traffic.",

        { q: "Risk-adjusted return per dollar is calculated as:", opts: ["Expected return only","(Expected return × probability of success) / resources required","Cost / Revenue","Revenue − Cost"], correct: 1 }

    {
      id: "m4", num: "Module 4", title: "Data & Decision Science",
      sub: "Applying statistical/data reasoning to business decisions",
      time: "2–3 hrs",
      concepts: [
        { t: "Statistical vs. Practical Significance",

          ex: "Variant B converts at 4.3% vs A's 4.1%, p=0.03 over 500K visitors — statistically real, but a 0.2pt lift may not justify the engineering cost of shipping and maintaining it." },
        { t: "Correlation vs. Causation, and Confounders",

  });
  function courseUnitIds(course){
    return course.modules.map(function(m){ return course.key + "-" + m.id; }).concat([course.key + "-" + course.capstone.id]);
  }

  // ---------- STATUS HELPERS ----------
  function moduleStatus(unitId){
    var entry = UNIT_INDEX[unitId];
    if (!entry) return "notstarted";
    var ms = getModState(entry.course.key, entry.localId);
    var def = entry.def;
    var rubricLen = def.rubric ? def.rubric.length : (def.assignment ? def.assignment.rubric.length : 0);
    var checkedCount = 0;
    for (var i=0;i<rubricLen;i++){ if (ms.assignment[i]) checkedCount++; }
    var assignmentDone = rubricLen>0 && checkedCount===rubricLen;
    if (ms.quizPassed && assignmentDone) return "done";
    if (ms.quizAnswers || checkedCount>0) return "progress";
    return "notstarted";
  }
  function courseProgress(course){
    var ids = courseUnitIds(course);
    var done = ids.filter(function(id){ return moduleStatus(id)==="done"; }).length;
    return { done: done, total: ids.length, pct: Math.round((done/ids.length)*100) };
  }
  function courseAllComplete(course){
    return courseUnitIds(course).every(function(id){ return moduleStatus(id)==="done"; });
  }
  // Correct answers needed to pass: ~70%, rounded so a 3-question quiz passes at 2/3.
  function passMark(quiz){ return Math.max(1, Math.round(quiz.length * 0.7)); }
  // Stamp the completion date when the last unit is finished; clear it if the course is reopened.
  function syncCompletion(course){
    var cp = getCourseProgress(course.key);
    var complete = courseAllComplete(course);
    if (complete && !cp.completedAt) cp.completedAt = new Date().toISOString();
    else if (!complete && cp.completedAt) cp.completedAt = null;
  }
  function resumeTarget(course){
    var ids = courseUnitIds(course);
    var t = ids.find(function(id){ return moduleStatus(id)==="progress"; }) || ids.find(function(id){ return moduleStatus(id)!=="done"; });
    return t || ids[0];
  }
  function nextUnit(){
    var best = null;
    COURSES.forEach(function(c){
      courseUnitIds(c).forEach(function(id){ if (!best && moduleStatus(id)==="progress") best = { course: c, id: id, label: "Continue" }; });
    });
    if (!best){
      COURSES.forEach(function(c){
        courseUnitIds(c).forEach(function(id){ if (!best && moduleStatus(id)==="notstarted") best = { course: c, id: id, label: "Start" }; });
      });
    }
    return best;
  }

  // ---------- DIAGRAMS (Mermaid) ----------
  var mermaidReady = false;
  function mountDiagrams(m){
    if (!m.diagrams) return;
    var holders = document.querySelectorAll(".diagram-holder");
    var nodes = [];
    holders.forEach(function(h){
      var idx = parseInt(h.getAttribute("data-idx"),10);
      var pre = document.createElement("pre");
      pre.className = "mermaid";
      pre.textContent = m.diagrams[idx].code;
      pre.setAttribute("data-idx", idx);
      h.appendChild(pre);
      nodes.push(pre);
    });
    function fallback(){
      nodes.forEach(function(n){
        var idx = parseInt(n.getAttribute("data-idx"),10);
        n.className = "diagram-fallback";
        n.textContent = m.diagrams[idx].code;
      });
    }
    if (window.mermaid){
      try {
        if (!mermaidReady){ mermaid.initialize({ startOnLoad:false, securityLevel:"strict", theme:"neutral" }); mermaidReady = true; }
        mermaid.run({ nodes: nodes }).catch(fallback);
      } catch(e){ fallback(); }
    } else { fallback(); }
  }

  // ---------- UNIT PAGE ----------
  function applyQuizFeedback(m, ms){
    if (!ms.quizAnswers) return;
    document.querySelectorAll(".quiz-opt").forEach(function(el){
      var qi = parseInt(el.getAttribute("data-qi"),10);
      var oi = parseInt(el.getAttribute("data-oi"),10);
      el.classList.remove("correct","incorrect");
      if (oi === m.quiz[qi].correct) el.classList.add("correct");
      else if (oi === ms.quizAnswers[qi]) el.classList.add("incorrect");
    });
    var correctCount = 0;
    m.quiz.forEach(function(q, qi){ if (ms.quizAnswers[qi]===q.correct) correctCount++; });
    var slot = document.getElementById("quiz-result-slot");
    var need = passMark(m.quiz);
    var msg;
    if (correctCount >= need) msg = "Passed! This unit's quiz is marked complete.";
    else if (ms.quizPassed) msg = "Below the pass mark this time ("+need+" of "+m.quiz.length+" needed), but your earlier pass still counts.";
    else msg = "Not quite. You need "+need+" of "+m.quiz.length+" correct to pass. Review the concepts above and try again.";
    slot.innerHTML = "<div class='quiz-result "+(ms.quizPassed?"pass":"fail")+"'>Score: "+ms.quizScore+"% ("+correctCount+"/"+m.quiz.length+") — "+msg+"</div>";
  }

    });
    body += secWrap("sec-assignment", "edit", m.assignment ? "Hands-on assignment" : "Capstone deliverable", a);
    subnav.push(["sec-assignment","Assignment"]);

    if (m.reflection){
      var rl = "<ol class='reflect-list'>"; m.reflection.forEach(function(r){ rl += "<li>"+r+"</li>"; }); rl += "</ol>";
      body += secWrap("sec-reflect", "list", "Reflection questions", rl);
      subnav.push(["sec-reflect","Reflection"]);
    }

    var q = "<form id='quiz-form'>";
    m.quiz.forEach(function(qq, qi){
      q += "<div class='quiz-q'><div class='qtext'>"+(qi+1)+". "+qq.q+"</div>";
      qq.opts.forEach(function(opt, oi){
        var checked = (ms.quizAnswers && ms.quizAnswers[qi]===oi) ? " checked" : "";
        q += "<label class='quiz-opt' data-qi='"+qi+"' data-oi='"+oi+"'><input type='radio' name='q"+qi+"' value='"+oi+"'"+checked+"><span>"+opt+"</span></label>";
      });
      q += "</div>";
    });
    q += "<button type='button' class='btn' id='quiz-submit'>Submit answers</button><div id='quiz-result-slot'></div></form>";
    body += secWrap("sec-quiz", "quiz", "Knowledge check", q);
    subnav.push(["sec-quiz","Quiz"]);

    var ids = courseUnitIds(course);
    var idx = ids.indexOf(unitId);
    var prevId = idx>0 ? ids[idx-1] : null;
    var nextId = idx<ids.length-1 ? ids[idx+1] : null;

    var h = "<div class='page' style='"+cvars(course)+"'>";
    h += "<div class='crumbs'><a href='#home'>All courses</a> / <a href='#"+course.key+"-home'>"+course.name+"</a></div>";
    h += "<div class='unit-head'>"+thumb(course, unitIcon(course, unitId), 60)+"<div><div class='eyebrow'>"+m.num+"</div><h1>"+m.title+"</h1><p>"+m.sub+"</p><div class='meta-chips'><span class='meta-chip'>"+icon("clock",14)+" "+m.time+"</span>"+(m.concepts ? "<span class='meta-chip'>"+icon("book",14)+" "+m.concepts.length+" concepts</span>" : "")+"<span class='meta-chip'>"+icon("quiz",14)+" "+m.quiz.length+"-question quiz</span><span id='unit-status'>"+statusPill(status)+"</span></div></div></div>";
    h += "<div class='subnav'>"+subnav.map(function(s){ return "<button type='button' data-target='"+s[0]+"'>"+s[1]+"</button>"; }).join("")+"</div>";
    h += body;
    h += "<div class='nav-buttons no-print'>";
    h += prevId ? "<a class='btn outline' href='#"+prevId+"'>"+icon("arrow-left",16)+" Previous</a>" : "<span></span>";
    h += nextId ? "<a class='btn' href='#"+nextId+"'>Next "+icon("arrow-right",16)+"</a>" : "<a class='btn' href='#"+course.key+"-certificate'>Go to certificate "+icon("arrow-right",16)+"</a>";
    h += "</div></div>";
    main.innerHTML = h;

    mountDiagrams(m);
    applyQuizFeedback(m, ms);

    function refreshChrome(){
      document.getElementById("unit-status").innerHTML = statusPill(moduleStatus(unitId));
      renderTopbar();
      renderSidebar(course, currentRoute());
    }

    document.querySelectorAll(".subnav button").forEach(function(b){
      b.addEventListener("click", function(){
        var el = document.getElementById(b.getAttribute("data-target"));
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });

    document.querySelectorAll(".rubric-check").forEach(function(cb){
      cb.addEventListener("change", function(e){
        var idx2 = parseInt(e.target.getAttribute("data-idx"),10);
        ms.assignment[idx2] = e.target.checked;
        syncCompletion(course);
        saveState();
        var n = 0; rubric.forEach(function(r, i){ if (ms.assignment[i]) n++; });
        document.getElementById("check-count").textContent = n + " / " + rubric.length;
        document.getElementById("check-fill").style.width = Math.round(n/rubric.length*100) + "%";
        refreshChrome();
      });
    });

    document.getElementById("quiz-submit").addEventListener("click", function(){
      var answers = [];
      var allAnswered = true;
      m.quiz.forEach(function(qq, qi){
        var sel = document.querySelector("input[name='q"+qi+"']:checked");
        if (!sel){ allAnswered = false; answers.push(null); }
        else answers.push(parseInt(sel.value,10));
      });
      var slot = document.getElementById("quiz-result-slot");
      if (!allAnswered){
        slot.innerHTML = "<div class='quiz-result fail'>Please answer every question before submitting.</div>";
        return;
      }
      var correctCount = 0;
      m.quiz.forEach(function(qq, qi){ if (answers[qi]===qq.correct) correctCount++; });
      var score = Math.round((correctCount/m.quiz.length)*100);
      ms.quizAnswers = answers;
      ms.quizScore = score;
      // A pass is kept: a later failed retake must not re-lock the unit or the certificate.
      ms.quizPassed = ms.quizPassed || correctCount >= passMark(m.quiz);
      syncCompletion(course);
      saveState();
      applyQuizFeedback(m, ms);
      refreshChrome();
    });
  }

  // ---------- BONUS ----------
  function renderBonus(course){
    var main = setMain("");
    var bonus = course.bonus;
    var h = "<div class='page' style='"+cvars(course)+"'>";
    h += "<div class='crumbs'><a href='#home'>All courses</a> / <a href='#"+course.key+"-home'>"+course.name+"</a></div>";
    h += "<div class='unit-head'>"+thumb(course,"sparkle",60)+"<div><div class='eyebrow'>Bonus</div><h1>LinkedIn post &amp; blog outline</h1><p>Reflection content generated alongside the course, ready to personalize and publish.</p></div></div>";
    h += secWrap("sec-li", "chat", "LinkedIn post (150–200 words)", "<div class='bonus-block'>"+escapeHtml(bonus.linkedin)+"</div><button class='btn outline sm copy-btn' id='copy-li'>Copy text</button>");
    var b = "";
    if (bonus.blogTitle) b += "<p><b>Working title:</b> "+bonus.blogTitle+"</p>";
    bonus.blog.forEach(function(x){ b += "<h4 style='color:var(--ink);text-transform:none;letter-spacing:0;font-size:15.5px;margin:16px 0 4px'>"+x.h+"</h4><p>"+x.b+"</p>"; });
    h += secWrap("sec-blog", "edit", "Blog outline"+(bonus.blogFor ? " for "+bonus.blogFor : ""), b);
    h += "</div>";
    main.innerHTML = h;
    document.getElementById("copy-li").addEventListener("click", function(){
      var btn = document.getElementById("copy-li");
      function flash(text){
        btn.textContent = text;
        setTimeout(function(){ btn.textContent = "Copy text"; }, 1500);
      }
      // Older browsers and some file:// contexts have no async clipboard API.
      function legacyCopy(){
        var ta = document.createElement("textarea");
        ta.value = bonus.linkedin;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch(e){}
        document.body.removeChild(ta);
        flash(ok ? "Copied!" : "Copy failed, select the text manually");
      }
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(bonus.linkedin).then(function(){ flash("Copied!"); }, legacyCopy);
      } else { legacyCopy(); }
    });
  }

  // ---------- REFERENCES ----------
  function renderReferences(course){
    var main = setMain("");
    var refs = REFERENCES[course.key];
    var cats = REF_CATS.filter(function(c){ return refs[c.key] && refs[c.key].length; });
    var h = "<div class='page' style='"+cvars(course)+"'>";
    h += "<div class='crumbs'><a href='#home'>All courses</a> / <a href='#"+course.key+"-home'>"+course.name+"</a></div>";
    h += "<div class='unit-head'>"+thumb(course,"bookmark",60)+"<div><div class='eyebrow'>References</div><h1>Further reading, listening and watching</h1><p>Recommended sources to go deeper on the ideas in this course. Each one opens a web search for the title, so you can choose where to read, listen or watch.</p></div></div>";
    h += "<div class='subnav'>"+cats.map(function(c){ return "<button type='button' data-target='ref-"+c.key+"'>"+c.label+"</button>"; }).join("")+"</div>";
    cats.forEach(function(c){
      var list = "<div class='ref-list'>";
      refs[c.key].forEach(function(r){
        var q = encodeURIComponent(r.t + " " + r.by);
        list += "<a class='ref-item' href='https://www.google.com/search?q="+q+"' target='_blank' rel='noopener noreferrer'><div class='ref-text'><div class='ref-title'>"+escapeHtml(r.t)+"</div><div class='ref-by'>"+escapeHtml(r.by)+"</div><div class='ref-note'>"+escapeHtml(r.note)+"</div></div><span class='ref-go'>"+icon("search",15)+" Find</span></a>";
      });
      list += "</div>";
      h += secWrap("ref-"+c.key, c.ico, c.label, list);
    });
    h += "<div class='note-box'>These are independent recommendations. This course is not affiliated with or endorsed by any of the authors or publishers listed.</div>";
    h += "<div class='nav-buttons no-print'><a class='btn outline' href='#"+course.key+"-bonus'>"+icon("arrow-left",16)+" Bonus content</a><a class='btn' href='#"+course.key+"-certificate'>Go to certificate "+icon("arrow-right",16)+"</a></div>";
    h += "</div>";
    main.innerHTML = h;
    document.querySelectorAll(".subnav button").forEach(function(b){
      b.addEventListener("click", function(){
        var el = document.getElementById(b.getAttribute("data-target"));
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
  }

  // ---------- CERTIFICATE ----------
  function renderCertificate(course){
    var main = setMain("");
    var h = "<div class='page' style='"+cvars(course)+"'>";
    h += "<div class='crumbs no-print'><a href='#home'>All courses</a> / <a href='#"+course.key+"-home'>"+course.name+"</a></div>";
    if (!courseAllComplete(course)){
      var prog = courseProgress(course);
      h += "<div class='unit-head'>"+thumb(course,"lock",60)+"<div><div class='eyebrow'>Certificate</div><h1>Course completion certificate</h1><p>Complete every unit's assignment checklist and knowledge check (about 70% correct) to unlock your certificate.</p></div></div>";
      h += "<div class='lock-note'>"+icon("lock",20)+"<span>"+prog.done+" of "+prog.total+" units complete. Finish the remaining units to unlock your certificate.</span></div></div>";
      main.innerHTML = h;
      return;
    }
    var cp = getCourseProgress(course.key);
    if (!cp.completedAt){ cp.completedAt = new Date().toISOString(); saveState(); }
    var dateStr = new Date(cp.completedAt).toLocaleDateString(undefined, { year:"numeric", month:"long", day:"numeric" });
    var name = state.learnerName && state.learnerName.trim() ? state.learnerName.trim() : "Course Participant";
    var moduleNames = course.modules.map(function(m){ return m.title.split(":")[0]; }).join(", ");
    h += "<div class='cert-wrap'><div class='certificate'><div class='ribbon'></div>";
    h += "<div class='kicker'>Certificate of completion</div><h2>This certifies that</h2>";
    h += "<div class='learner-name'>"+escapeHtml(name)+"</div><h2>has successfully completed</h2>";
    h += "<div class='coursename'>"+course.name+"</div>";
    h += "<p style='color:var(--ink3);font-size:13px;max-width:540px;margin:8px auto 0;'>"+course.modules.length+" modules: "+moduleNames+", plus a capstone case study</p>";
    h += "<div class='seal'>"+icon("award",34)+"</div><div class='meta'>Completed on "+dateStr+"</div></div></div>";
    h += "<div class='cert-wrap no-print'><button class='btn' id='print-cert'>Print / save as PDF</button></div></div>";
    main.innerHTML = h;
    document.getElementById("print-cert").addEventListener("click", function(){ window.print(); });
  }

  // ---------- ROUTER ----------
  function render(){
    var route = currentRoute();
    var course = null, rest = null;
    var dashIdx = route.indexOf("-");
    if (dashIdx > -1){
      course = findCourse(route.substring(0, dashIdx));
      rest = route.substring(dashIdx+1);
    }
    document.body.classList.toggle("has-side", !!course);
    document.body.classList.remove("side-open");
    renderTopbar();
    if (course){
      renderSidebar(course, route);
      if (rest === "home") renderCourseHome(course);
      else if (rest === "bonus") renderBonus(course);
      else if (rest === "references" && REFERENCES[course.key]) renderReferences(course);
      else if (rest === "certificate") renderCertificate(course);
      else if (UNIT_INDEX[route]) renderModule(course, UNIT_INDEX[route].def);
      else renderCourseHome(course);
    } else {
      renderHome();
    }
    window.scrollTo(0,0);
  }
  window.addEventListener("hashchange", render);
  render();
})();
</script>
